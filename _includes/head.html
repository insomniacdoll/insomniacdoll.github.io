<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>

  {% seo title=false %}
  {% feed_meta %}

  <link rel="icon" href="{{ site.favicon | relative_url }}" />
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-precomposed.png' | relative_url }}" />
  <meta name="theme-color" content="#ffffff" />

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% if site.theme_config.appearance_toggle %}
    {% include toggle_theme_js.html %}
  {% endif %}

  {%- include custom_head.html -%}
</head>
